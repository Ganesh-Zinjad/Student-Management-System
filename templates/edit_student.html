<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Update Student</title>

    <link rel="stylesheet" href="/static/css/Admin.css" />
  </head>

  <body>
    <div class="admin-container">
      <div class="header">
        <div>
          <h1>Update Student</h1>
          <p>Edit Student Information</p>
        </div>
      </div>

      <div class="section">
        <h2>Student Details</h2>

        <form action="#" method="PATCH" id="update_student">
          <div class="form-grid">
            <div class="form-group">
              <label>Admission Number</label>
              <input
                type="text"
                name="admission_no"
                value="ADM2024001"
                required
              />
            </div>

            <div class="form-group">
              <label>Full Name</label>
              <input type="text" name="name" value="Rahul Sharma" required />
            </div>

            <div class="form-group">
              <label>Age</label>
              <input
                type="number"
                name="age"
                min="1"
                max="120"
                value="21"
                required
              />
            </div>

            <div class="form-group">
              <label>Course</label>
              <input
                type="text"
                name="course"
                value="Computer Science"
                required
              />
            </div>

            <div class="form-group">
              <label>Gender</label>
              <select name="gender" required>
                <option value="Male" selected>Male</option>

                <option value="Female">Female</option>

                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label>Phone Number</label>
              <input
                type="tel"
                name="phone_no"
                value="9876543210"
                required
              />
            </div>

            <div class="form-group">
              <label>Average CGPA</label>
              <input
                type="number"
                name="cgpa"
                min="0"
                max="10"
                step="0.01"
                value="8.75"
                required
              />
            </div>

            <div class="form-group">
              <label>Passing Year</label>
              <input
                type="number"
                name="passing_year"
                min="2000"
                max="2100"
                value="2025"
                required
              />
            </div>
          </div>

          <div class="form-buttons">
            <button type="submit" class="add-btn">Update Student</button>
          </div>
        </form>
        <br>
        <a href="/admin">
              <button name="cancel" class="delete-btn">Cancel</button>
            </a>
      </div>
    </div>
    <script src="/static/javascript/edit.js" defer></script>
  </body>
</html>
